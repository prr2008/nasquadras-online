name: explore-fiba
on:
  push:
    branches: [explore-fiba]
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/explore_fiba.py
      - uses: actions/upload-artifact@v4
        with:
          name: fiba-samples
          path: out/
