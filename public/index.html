<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nas Quadras">
  <title>Nas Quadras Online</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff7a1a'/%3E%3Cpath d='M4 32h56M32 4v56M12 12c10 10 10 30 0 40M52 12c-10 10-10 30 0 40' stroke='%230f1115' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- LOGIN -->
  <section id="login" class="screen" hidden>
    <form id="login-form" class="login-card">
      <div class="brand big"><span class="ball" aria-hidden="true"></span>Nas Quadras <em>ao vivo</em></div>
      <label for="password">Senha do app</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Entrar</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- APP -->
  <main id="app" class="screen" hidden>
    <header class="topbar">
      <div class="brand"><span class="ball" aria-hidden="true"></span>Nas Quadras <em>ao vivo</em></div>
      <div class="accounts">
        <button id="acc-threads" class="pill" type="button" title="Threads">Threads</button>
        <button id="acc-bluesky" class="pill" type="button" title="Bluesky">Bluesky</button>
      </div>
    </header>

    <!-- PLACAR -->
    <section class="board" aria-label="Placar do jogo">
      <div class="team">
        <input id="away" class="team-name" placeholder="Mandante" maxlength="24" aria-label="Time mandante">
        <input id="sa" class="score" type="number" inputmode="numeric" min="0" max="999" value="0" aria-label="Pontos do mandante">
        <div class="score-btns" data-team="a">
          <button type="button" data-d="1">+1</button><button type="button" data-d="2">+2</button>
          <button type="button" data-d="3">+3</button><button type="button" data-d="-1" class="minus">−1</button>
        </div>
      </div>
      <div class="mid">
        <select id="period" aria-label="Período">
          <option value="1Q">1º Q</option><option value="2Q">2º Q</option>
          <option value="INT">Intervalo</option>
          <option value="3Q">3º Q</option><option value="4Q">4º Q</option>
          <option value="OT">Prorr.</option><option value="FINAL">Final</option>
        </select>
        <button id="insert-score" type="button" class="ghost small">Inserir placar</button>
        <button id="lnb-link" type="button" class="ghost small lnb-btn">📡 LNB</button>
        <button id="reset-game" type="button" class="link small">Zerar</button>
      </div>
      <div class="team">
        <input id="home" class="team-name" placeholder="Visitante" maxlength="24" aria-label="Time visitante">
        <input id="sh" class="score" type="number" inputmode="numeric" min="0" max="999" value="0" aria-label="Pontos do visitante">
        <div class="score-btns" data-team="h">
          <button type="button" data-d="1">+1</button><button type="button" data-d="2">+2</button>
          <button type="button" data-d="3">+3</button><button type="button" data-d="-1" class="minus">−1</button>
        </div>
      </div>
    </section>

    <!-- JOGO VINCULADO À LNB -->
    <div id="lnb-status" class="lnb-status" hidden aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="lnb-text"></span>
      <button id="lnb-refresh" type="button" class="link small" title="Atualizar agora">↻</button>
      <button id="lnb-unlink" type="button" class="link small">Desvincular</button>
    </div>
    <div class="chips data-chips" id="lnb-chips" hidden aria-label="Atalhos com dados da LNB">
      <button type="button" data-lnb="parciais">📊 Parciais</button>
      <button type="button" data-lnb="cestinhas">🏆 Cestinhas</button>
      <button type="button" data-lnb="destaques">⭐ Destaques</button>
      <button type="button" data-lnb="quarto">⏱️ Do quarto</button>
      <button type="button" data-lnb="ultima">🏀 Última cesta</button>
    </div>

    <!-- ATALHOS -->
    <div class="chips" id="templates" aria-label="Atalhos de texto">
      <button type="button" data-t="🔥 Cesta de 3! ">Cesta de 3</button>
      <button type="button" data-t="💥 Enterrada! ">Enterrada</button>
      <button type="button" data-t="🧱 Toco! ">Toco</button>
      <button type="button" data-t="⏱️ Pedido de tempo. ">Tempo</button>
      <button type="button" data-t="{fimq}">Fim do quarto</button>
      <button type="button" data-t="{final}">Final</button>
    </div>

    <!-- FIO DA COBERTURA -->
    <section id="thread-bar" class="thread-bar" aria-live="polite">
      <div class="thread-off">
        <span class="thread-label">Posts soltos</span>
        <button id="thread-start" type="button" class="ghost small">🧵 Iniciar fio do jogo</button>
      </div>
      <div class="thread-on" hidden>
        <div class="thread-info">
          <span class="thread-label">🧵 Fio ativo <span id="thread-title"></span></span>
          <span id="thread-meta" class="thread-meta"></span>
        </div>
        <label class="switch" title="Responder no fio"><input id="thread-reply" type="checkbox" checked><span></span></label>
        <button id="thread-stop" type="button" class="link small">Encerrar</button>
      </div>
    </section>

    <!-- COMPOSIÇÃO -->
    <section class="composer">
      <textarea id="text" rows="6" placeholder="O que está acontecendo na quadra?" aria-label="Texto do post"></textarea>

      <div class="tagline">
        <label class="switch"><input id="auto-tags" type="checkbox"><span></span></label>
        <input id="tags" placeholder="#NBA #NasQuadras" aria-label="Hashtags fixas">
      </div>

      <div id="media" class="media-grid"></div>

      <div class="toolbar">
        <label class="ghost file-btn">
          <input id="file" type="file" accept="image/*,video/*" multiple hidden>
          <span aria-hidden="true">＋</span> Foto / vídeo
        </label>
        <div class="counters">
          <span id="count-threads" class="count">0/500</span>
          <span id="count-bluesky" class="count">0/300</span>
        </div>
      </div>

      <div class="targets">
        <label class="target"><input type="checkbox" id="t-threads" checked><span>Threads</span></label>
        <label class="target"><input type="checkbox" id="t-bluesky" checked><span>Bluesky</span></label>
      </div>

      <p id="warnings" class="warnings" aria-live="polite"></p>

      <button id="publish" type="button" class="primary publish">Publicar</button>
      <div id="progress" class="progress" aria-live="polite"></div>
    </section>

    <!-- HISTÓRICO -->
    <section class="history">
      <h2>Últimos posts</h2>
      <ol id="history"></ol>
    </section>

    <footer class="foot">
      <button id="logout" type="button" class="link small">Sair</button>
    </footer>
  </main>

  <!-- PAINEL DE CONTA -->
  <dialog id="account-dialog">
    <form method="dialog">
      <h3 id="dlg-title"></h3>
      <div id="dlg-body"></div>
      <menu><button value="close" class="ghost">Fechar</button></menu>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
